[package]
name = "meiliops"
version = "0.4.0"
description = "Native desktop admin app for Meilisearch"
authors = ["MeiliOps contributors"]
license = "MIT"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "meiliops_lib"
# Desktop only needs the rlib. The template's "staticlib" and "cdylib" are for iOS/Android, and
# with LTO each costs a full whole-program optimization pass: dropping them cut a cold release
# build from 503 s to 373 s with an identical binary (Research/09-ci-build-speed.md).
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-store = "2"
tauri-plugin-shell = "2"
tauri-plugin-upload = "2"
tauri-plugin-os = "2"
tauri-plugin-http = { version = "~2.7", features = ["unsafe-headers"] }
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

# Must match the versions wry uses (see Cargo.lock).
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-process = "~2.4"
tauri-plugin-updater = "~2.13"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
