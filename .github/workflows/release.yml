name: Release

# Push a version tag to publish a release:
#   git tag v0.3.0 && git push origin v0.3.0
# The tag must match the app version in package.json, Cargo.toml and tauri.conf.json.
# Tags with a suffix (v0.3.0-beta.1) are published as pre-releases.
#
# To rebuild an existing tag's release (e.g. after fixing this workflow), run it manually from
# the Actions tab with that tag. The tag's code is built with the workflow from the default branch.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and attach to its release (e.g. v0.3.0)
        required: true

env:
  TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}

defaults:
  run:
    working-directory: app

jobs:
  check:
    name: Checks + draft release
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.draft.outputs.release_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Tag matches app version
        run: |
          node -e '
            const fs = require("fs");
            const tag = process.env.TAG.replace(/^v/, "");
            const versions = {
              "package.json": require("./package.json").version,
              "tauri.conf.json": require("./src-tauri/tauri.conf.json").version,
              "Cargo.toml": fs.readFileSync("src-tauri/Cargo.toml", "utf8").match(/^version = "(.+)"/m)[1],
            };
            const bad = Object.entries(versions).filter(([, v]) => v !== tag);
            if (bad.length) {
              console.error(`Tag v${tag} does not match: ` + bad.map(([f, v]) => `${f}=${v}`).join(", "));
              process.exit(1);
            }'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run coverage -- --strict
      - name: Create (or reuse) the release
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Reuse the tag's release if one exists: published releases resolve by tag; a draft
          # has no tag until it's published ("untagged-…"), so match drafts by name instead.
          id=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json databaseId --jq .databaseId 2>/dev/null || true)
          [ -z "$id" ] && id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq ".[] | select(.draft and .name == \"MeiliOps $TAG\") | .id" | head -n1)
          if [ -z "$id" ]; then
            prerelease=false
            [[ "$TAG" == *-* ]] && prerelease=true
            # Take the id from the create response itself: looking it up again right after
            # creating is what left v0.3.0 without any files.
            id=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$TAG" -f name="MeiliOps $TAG" \
              -F draft=true -F prerelease=$prerelease -F generate_release_notes=true --jq .id)
          fi
          [ -n "$id" ] && [ "$id" != "null" ] || { echo "::error::Could not create or find the release for $TAG"; exit 1; }
          echo "release_id=$id" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.name }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            args: --bundles nsis
          - name: macOS Apple Silicon
            os: macos-latest
            rust-target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles dmg
          - name: macOS Intel
            os: macos-latest
            rust-target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin --bundles dmg
          - name: Linux x64
            os: ubuntu-22.04
            args: --bundles deb,rpm,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}
      # Restore-only: the cache is kept warm on main by rust-cache.yml. Tag builds can read main's
      # caches but not each other's, so saving here would only waste the 10 GB cache quota.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
          shared-key: tauri-${{ matrix.os }}-${{ matrix.rust-target }}
          save-if: false
      - name: Linux system libraries
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev
      - run: npm ci
      - name: Build and upload to the draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          projectPath: app
          releaseId: ${{ needs.check.outputs.release_id }}
          args: ${{ matrix.args }}

  publish:
    name: Publish release
    needs: [check, build]
    runs-on: ubuntu-latest
    steps:
      # Only reached when every platform built, so a release never goes out half-empty.
      - env:
          GH_TOKEN: ${{ github.token }}
        working-directory: .
        run: |
          # Never publish a release without files.
          count=$(gh api "repos/$GITHUB_REPOSITORY/releases/${{ needs.check.outputs.release_id }}" --jq '.assets | length')
          [ "$count" -gt 0 ] || { echo "::error::Release has no assets; not publishing"; exit 1; }
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/${{ needs.check.outputs.release_id }}" -F draft=false --jq .html_url
