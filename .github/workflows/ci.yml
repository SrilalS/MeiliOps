name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: app

jobs:
  check:
    name: Typecheck + API coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # Fails when a stable Meilisearch operation has no dedicated screen.
      - run: npm run coverage -- --strict
      - run: npm run build

  build:
    name: Build (${{ matrix.os }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - name: Linux system libraries
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev
      - run: npm ci
      # Windows builds the NSIS installer (the shipping target); the others only prove they compile.
      - name: Build installer
        if: runner.os == 'Windows'
        run: npm run tauri build
      - name: Build app
        if: runner.os != 'Windows'
        run: npm run tauri build -- --no-bundle
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: MeiliOps-windows-installer
          path: app/src-tauri/target/release/bundle/nsis/*.exe
